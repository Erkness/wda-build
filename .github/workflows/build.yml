name: Build WebDriverAgent

on:
  workflow_dispatch:   # permet de le lancer manuellement depuis l'onglet "Actions"

jobs:
  build:
    runs-on: macos-15   # machine Mac fournie par GitHub, Xcode récent préinstallé
    steps:
      - name: Cloner WebDriverAgent
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          submodules: recursive

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Préparer le projet (npm, remplace l'ancien Scripts/bootstrap.sh)
        run: npm install

      - name: Compiler (sans signature, pour la re-signer nous-mêmes ensuite)
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Empaqueter en .ipa (structure Payload/ requise par Sideloadly)
        run: |
          cd build/Build/Products/Debug-iphoneos
          mkdir -p Payload
          cp -R WebDriverAgentRunner-Runner.app Payload/
          zip -r WebDriverAgent.ipa Payload

      - name: Publier le .ipa comme résultat téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-ipa
          path: build/Build/Products/Debug-iphoneos/WebDriverAgent.ipa
